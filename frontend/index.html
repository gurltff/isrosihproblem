<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5EFEB" />
    <meta name="description" content="Burn-in screening intelligence: lot-relative anomaly detection, drift prediction and surface inspection for space-grade components." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Libre+Caslon+Text:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Sentinel · Burn-in Intelligence</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="font: 15px/1.5 system-ui, sans-serif; color: #2f4156; padding: 48px 24px; max-width: 560px">
        <div style="font: 700 28px Georgia, serif; margin-bottom: 8px">Sentinel</div>
        <div id="boot-msg">Loading…</div>
      </div>
    </div>
    <script>
      // If the app cannot start, say why instead of leaving a blank page.
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-msg");
          if (!el) return;
          el.innerHTML =
            '<b style="color:#a5432f">The app could not start.</b><br>' + msg +
            '<br><br>Try a hard refresh (Ctrl+Shift+R, or Cmd+Shift+R on a Mac). If it still fails, send a screenshot of this message.';
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) show("A file failed to load: " + (t.src || t.href));
          else if (e.message) show("Error: " + e.message);
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          show("Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
        setTimeout(function () {
          if (document.getElementById("boot")) show("It is taking unusually long. Your connection may be blocking a file.");
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
